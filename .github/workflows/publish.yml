name: Publish to PyPI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Require a matching stable release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_REF" == refs/tags/v* ]] || { echo 'Publishing requires a version tag'; exit 1; }
          python scripts/release_metadata.py --check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
  checks:
    needs: release-ref
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
  existing-artifacts:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Reject conflicting already published bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_pypi_release.py "${RELEASE_TAG#v}" --dist dist --existing-only
  publish:
    needs: existing-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goofish-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish checked distributions via OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
  verify:
    timeout-minutes: 15
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Install release verification runtime
        run: |
          pip install uv
          uv venv
          uv pip install 'mcp>=1.2,<2'
      - name: Verify actual PyPI CLI, MCP and artifact hashes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/verify_pypi_release.py "${RELEASE_TAG#v}" --dist dist
