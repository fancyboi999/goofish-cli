name: Publish to PyPI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Require a matching stable release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_REF" == refs/tags/v* ]] || { echo 'Publishing requires a version tag'; exit 1; }
          python scripts/release_metadata.py --check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
  checks:
    needs: release-ref
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
  existing-artifacts:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Reject conflicting already published bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_pypi_release.py "${RELEASE_TAG#v}" --dist dist --existing-only
  publish:
    needs: existing-artifacts
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/goofish-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish checked distributions via OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
  verify:
    timeout-minutes: 15
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install release verification runtime
        run: |
          pip install uv
          uv venv
          uv pip install 'mcp>=1.2,<2'
      - name: Verify actual PyPI CLI, MCP and artifact hashes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/verify_pypi_release.py "${RELEASE_TAG#v}" --dist dist
